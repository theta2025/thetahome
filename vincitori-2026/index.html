<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theta 2026 — Vincitori e menzioni</title><style>*{box-sizing:border-box}body{margin:0;background:#111318;color:#f4f2ee;font:16px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:36px 22px 70px}header{border-bottom:1px solid #bca36b;padding:30px 0 42px}h1{font-size:clamp(38px,7vw,80px);line-height:1.04;margin:20px 0}small,.award{color:#d9bd7d;letter-spacing:.13em;text-transform:uppercase}button{background:transparent;color:inherit;border:1px solid #a68d58;padding:8px 18px;cursor:pointer}button[aria-pressed=true]{background:#d9bd7d;color:#111}section{margin-top:42px}h2{font-size:25px;border-bottom:1px solid #444;padding-bottom:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}article{padding:26px;background:#1c2028;border-top:3px solid #d9bd7d}article.mention{border-color:#999}h3{font-size:30px;line-height:1.15;margin:12px 0}.author{color:#ddd}blockquote{margin:20px 0 0;color:#ddd}footer{margin-top:50px;color:#aaa}</style><main><header><small>THETA SHORT FILM FESTIVAL · 5ª EDIZIONE · 2026</small><div style="float:right"><button id="it" onclick="render(0)">IT</button> <button id="en" onclick="render(1)">EN</button></div><h1 id="heading"></h1><p id="date"></p></header><div id="results"></div><footer>THETA SHORT FILM FESTIVAL · NOLA · 2026</footer></main><script>const data=[["Documentari brevi","Short Documentary","I Wanted To Hear Your Voice","James Pellerito",0,"Per aver saputo raccontare l’amore dentro il dolore, senza cedere alla retorica. Attraverso uno sguardo intimo e misurato, e con grande rigore stilistico, restituisce la complessità di un legame familiare messo alla prova dalla malattia, trovando nei gesti quotidiani tutta la delicatezza e la profondità dei sentimenti umani.","For portraying love amid pain without resorting to rhetoric. Through an intimate, measured perspective and stylistic rigor, it captures a family bond tested by illness and the depth of human feelings in everyday gestures."],["Documentari brevi","Short Documentary","Kite","Thanos Psichogios",1,"Per il valore intimo del racconto capace di trasformare il ricordo di un legame familiare in una riflessione universale sulla memoria, sul tempo e sulla fragilità delle relazioni. Per uno stile originale e ricercato in cui elementi onirici e animati aprono la narrazione a una dimensione poetica e immaginativa.","For transforming the memory of a family bond into a universal reflection on memory, time and the fragility of relationships, through an original style combining dreamlike and animated elements."],["Studenteschi","Student Short Film","BAGARRE","Sarah Narducci",0,"Per aver saputo raccontare il rapporto con l'ambiente universitario, con le aspettative, le speranze e le paure riguardo al futuro e la solitudine giovanile, temi che si intrecciano in maniera insieme pesante e leggera.","For exploring university life, expectations, hopes and fears for the future, and youthful loneliness, interweaving gravity and lightness."],["Studenteschi","Student Short Film","COMPOST","Erik Semashkin",1,"Per la capacità di condensare in una storia apparentemente semplice temi complessissimi riguardo alla natura umana e del mondo, la vita e la morte, la bellezza e la repulsione del mondo organico dal quale tutti proveniamo e torniamo.","For condensing complex themes of human nature, life and death, and the beauty and repulsion of the organic world into an apparently simple story."],["Internazionali","International Short Film","THE SELFISH – Les Egoistes","Nicolas Landais, Mathieu Landais",0,"Per aver saputo trasformare lo spazio circoscritto di una casa in un piccolo universo, in cui le interazioni tra i due protagonisti si fanno incredibilmente umane, intime e autentiche. Una relazione umana raccontata nella sua natura più contraddittoria, al tempo stesso pura e sporca, fragile e istintiva, che trova nella macchina da presa uno sguardo capace di accompagnarla con sensibilità e grande consapevolezza.","For having transformed the confined space of a house into a small universe, where the interactions between the two protagonists become remarkably human, intimate and authentic. A human relationship portrayed in its most contradictory nature, at once pure and raw, fragile and instinctive, finding in the camera a gaze capable of accompanying it with sensitivity and great awareness."],["Sceneggiature","Screenplay","Con un filo di voce","Miriam Casadio, Giorgia Faietti, Asia Franceschini, Mariachiara Iannizzotto, Irene Maccaferri",0,"Per aver affrontato un tema doloroso e complesso con sensibilità e consapevolezza. Una scrittura che trova nella misura del racconto e nella forza delle parole la capacità di trasformare una storia individuale in una riflessione collettiva, restituendo voce a ciò che troppo spesso rimane inascoltato.","For addressing a painful and complex subject with sensitivity and awareness, transforming an individual story into a collective reflection and giving voice to what too often remains unheard."],["Miglior regia","Best Direction","Pit","Egor Koreshkov",0,"Per aver costruito un universo visivo iperbolico e surreale, in cui una scenografia rigorosamente simmetrica e atmosfere dai tratti fantastici restituiscono, per contrasto, condizioni profondamente umane. Una regia capace di muoversi tra realtà e immaginazione, trasformando lo spazio in uno specchio della condizione interiore dei personaggi e trovando in un linguaggio visivo fortemente caratterizzato la propria cifra espressiva.","For creating a hyperbolic, surreal visual universe where symmetrical sets and fantastic atmospheres reveal deeply human conditions, transforming space into a mirror of the characters’ inner lives."]];function render(l){document.documentElement.lang=l?'en':'it';document.getElementById('heading').textContent=l?'Winners & special mentions':'Vincitori e menzioni';document.getElementById('date').textContent=l?'Official awards · 26 November 2026':'Premi ufficiali · 26 novembre 2026';document.getElementById('it').setAttribute('aria-pressed',!l);document.getElementById('en').setAttribute('aria-pressed',!!l);let root=document.getElementById('results');root.replaceChildren();let last='',cards;for(const row of data){if(last!==row[0]){last=row[0];let s=document.createElement('section'),h=document.createElement('h2');h.textContent=row[l];s.append(h);cards=document.createElement('div');cards.className='cards';s.append(cards);root.append(s)}let a=document.createElement('article');a.className=row[4]?'mention':'';for(const [tag,cls,val] of [['div','award',row[4]?(l?'Special mention':'Menzione speciale'):(l?'Winner':'Vincitore')],['h3','',row[2]],['div','author',row[3]],['blockquote','',row[5+l]]]){let e=document.createElement(tag);e.className=cls;e.textContent=val;a.append(e)}cards.append(a)}}render(0);</script></html>
