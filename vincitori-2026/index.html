<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CATALOGO VINCITORI 5 EDIZIONE</title><style>body{background:#C5D3E8;color:#333788;font:18px Arial;padding:24px}</style><p id="status">Caricamento catalogo…</p><script>(async()=>{try{const base=new URL('./assets/',location.href);const get=async(name)=>{const r=await fetch(new URL(name,base),{cache:'no-cache'});if(!r.ok)throw Error(name+' '+r.status);return r};const [template,...packs]=await Promise.all([get('catalogo-template.txt').then(r=>r.text()),...Array.from({length:15},(_,i)=>get('catalogo-pack-'+i+'.json').then(r=>r.json()))]);const images=new Map(packs.flat());if(images.size!==78)throw Error('Locandine incomplete');const html=template.replace(/__THETA_POSTER_(\d+)__/g,(_,i)=>images.get(Number(i)));document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Impossibile caricare il catalogo. Ricarica la pagina.';console.error(e)}})();</script></html>
