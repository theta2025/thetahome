 css.textContent=`
 :root{--blue:#333788!important;--blue2:#4d65AA!important;--paper:#C5D3E8!important;--red:#D73527!important;--orange:#D17715!important;--ink:#333788!important;--white:#C5D3E8!important}
 html,body{background:#C5D3E8!important;color:#333788!important}
 .hero{background:#C5D3E8!important;min-height:590px!important}
 .hero .shell{padding-top:65px!important;padding-bottom:70px!important}
 .hero h1{font-family:'Space Grotesk',Arial,sans-serif!important;font-size:clamp(47px,7.3vw,110px)!important;line-height:1.02!important;letter-spacing:-.073em!important;margin:23px 0 27px!important;max-width:930px!important;overflow-wrap:normal!important;word-break:normal!important}
 .hero h1 span{display:block!important;font-size:.63em!important;letter-spacing:-.06em!important;line-height:1.2!important;color:#D73527!important;margin-top:8px!important}
 .hero .kicker{color:#333788!important}
 .hero p{max-width:640px!important}
 .hero-dancer{mix-blend-mode:screen!important;opacity:.85!important;filter:none!important}
 .star{filter:none!important;background:transparent!important;mix-blend-mode:normal!important;opacity:1!important}
 .star img{background:transparent!important}
 /* Rotazione intermittente: un giro morbido seguito da una pausa */
 @keyframes thetaStarTurn{
   0%,16%{transform:rotate(0deg)}
   48%,100%{transform:rotate(360deg)}
 }
 .star.theta-spin{
   animation:thetaStarTurn 19s ease-in-out infinite!important;
   transform-origin:50% 50%!important;
   will-change:transform;
 }
 .star.theta-spin:nth-of-type(even){animation-duration:24s!important;animation-delay:-7s!important}
 @media(prefers-reduced-motion:reduce){
   .star.theta-spin{animation:none!important;will-change:auto!important}
 }
 .star-a{width:150px!important;right:9%!important;top:35px!important}
 .star-c{left:48%!important;top:190px!important;width:56px!important}
 .meta span{background:#C5D3E8!important;border-color:#4d65AA!important}
 .day:nth-of-type(even){background:#C5D3E8!important}
 .person{background:#333788!important}
 .poster-layout .eyebrow{color:#D17715!important}
 .poster-layout img{box-shadow:16px 16px 0 #D73527!important}
 .footer{background:#333788!important}
 .footer,.poster-section{color:#C5D3E8!important}
 .poster-section{background:#333788!important}
 .slot{border-color:#4d65AA!important}
 .cta{background:#D73527!important;color:#C5D3E8!important}
 .floating-booking,.floating-cta,.book-now,.prenota-float{background:#D73527!important}
 @media(max-width:850px){
  .hero h1{font-size:clamp(43px,8.5vw,75px)!important;max-width:calc(100vw - 55px)!important}
  .hero h1 span{font-size:.66em!important}
  .hero-dancer{opacity:.4!important}
 }
 @media(max-width:570px){
  .hero{min-height:510px!important}
  .hero .shell{padding-top:46px!important;padding-bottom:64px!important}
  .hero h1{font-size:clamp(39px,9vw,54px)!important;line-height:1.04!important;letter-spacing:-.07em!important;margin:22px 0!important;max-width:calc(100vw - 40px)!important}
  .hero h1 span{font-size:.68em!important;line-height:1.18!important;margin-top:7px!important}
  .hero-dancer{opacity:.25!important;right:-200px!important}
  .star-a{width:85px!important;right:4%!important;top:22px!important}
  .star-c{display:none!important}
 }
 `;
 d.head.appendChild(css);

 d.querySelectorAll('.star').forEach((img,i)=>{
   img.src=STARS[i % STARS.length];
   img.removeAttribute('srcset');
   img.style.background='transparent';
   if(i % 3 !== 1) img.classList.add('theta-spin');
 });

 // Rimuove i link descrittivi / biografici: lascia solo testo e mantiene le prenotazioni
 d.querySelectorAll('a[href]').forEach(a=>{
   const href=(a.getAttribute('href')||'').trim().toLowerCase();
   if(href.includes('prenotazioni')) return;
   const span=d.createElement('span');
   while(a.firstChild) span.appendChild(a.firstChild);
   span.className=a.className || '';
   if(a.getAttribute('style')) span.setAttribute('style', a.getAttribute('style'));
   a.replaceWith(span);
 });

 // Anche il sito in footer diventa testo semplice
 d.querySelectorAll('footer a, .footer a').forEach(a=>{
   if((a.getAttribute('href')||'').toLowerCase().includes('prenotazioni')) return;
   const span=d.createElement('span');
   span.textContent=a.textContent;
   span.className=a.className || '';
   if(a.getAttribute('style')) span.setAttribute('style', a.getAttribute('style'));
   a.replaceWith(span);
 });

} catch(err) {
 console.error('Aggiornamento grafico non applicato', err);
}
});
</script>
</body>
</html>
